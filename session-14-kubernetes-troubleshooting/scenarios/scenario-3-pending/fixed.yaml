# Fix for scenario 3: requests of 500 CPU / 1000Gi can never fit on a node
# with 24 CPU / ~7.6Gi allocatable. Ask for what nginx actually needs.
apiVersion: v1
kind: Pod
metadata:
  name: fail-3-pending-pod
  labels:
    tier: triage-gauntlet
    scenario: pending
spec:
  containers:
    - name: hungry-app
      image: nginx:alpine
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "128Mi"
