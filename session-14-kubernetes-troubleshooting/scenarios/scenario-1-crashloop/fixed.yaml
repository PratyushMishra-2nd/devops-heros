# Fix for scenario 1: the app exits 1 because DATABASE_URL is not set.
# Second fix: with only the env var added, the script prints its success line
# and exits 0, and restartPolicy Always restarts it forever (Completed ->
# CrashLoopBackOff). A real service keeps running, so it now stays up.
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: DATABASE_URL
          value: "postgresql://yatri:yatri@postgres-db:5432/yatri"
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully!", flush=True)
          while True:
              time.sleep(60)
