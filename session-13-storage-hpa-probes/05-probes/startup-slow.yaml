# Added for the write-up: same probes as startup.yaml, but nginx waits 20s
# before starting so the startup probe actually has something to protect.
apiVersion: v1
kind: Pod
metadata:
  name: startup-slow-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      command: ["sh", "-c", "echo 'pretending to warm up for 20s'; sleep 20; exec nginx -g 'daemon off;'"]
      ports:
        - containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: 80
        failureThreshold: 30
        periodSeconds: 2
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
